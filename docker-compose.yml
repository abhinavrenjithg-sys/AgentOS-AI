services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos-local-only}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agentos:${POSTGRES_PASSWORD:-agentos-local-only}@db:5432/agentos
      ARTIFACT_DIR: /data/artifacts
      FRONTEND_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:8000:10000"]
    volumes: ["agentos-artifacts:/data/artifacts"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
volumes:
  agentos-artifacts:
